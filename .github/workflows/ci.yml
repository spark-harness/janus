name: Janus CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: janus-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: janus-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: janus-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: janus-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: janus-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: janus-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "dist/${{ matrix.artifact }}" ./cmd/janus
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
